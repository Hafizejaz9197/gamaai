name: Deploy

# Every push to main (a merged PR) is tested, then copied to the Hostinger
# server over SSH: the SaaS to ~/gama-saas, and, when DEPLOY_PLUGIN below is
# "true", the plugin to the test site's existing Gama AI plugin folder.
# It can also be started by hand (Actions → Deploy → Run workflow) on any
# branch, so work can go to the test server before its PR is merged.
# Needs the repository secret DEPLOY_SSH_KEY (see docs/deploy-hostinger.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SSH_HOST: 145.79.28.114
  SSH_PORT: '65002'
  SSH_USER: u160003797
  SAAS_DIR: gama-saas
  # Writes only the existing wp-content/plugins/gama-ai folder (approved 2026-10-24).
  DEPLOY_PLUGIN: 'true'
  PLUGIN_DIR: domains/avadawebsites.com/public_html/sabahat/wp-content/plugins/gama-ai

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - name: SaaS tests
        working-directory: saas
        run: |
          composer install --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan test
      - name: Plugin tests
        working-directory: plugin/gama-ai
        run: |
          composer install --no-interaction --no-progress
          vendor/bin/phpunit

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::The DEPLOY_SSH_KEY secret is missing. See docs/deploy-hostinger.md, 'Automatic deploys'."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          printf 'Host server\n  HostName %s\n  Port %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n' \
            "$SSH_HOST" "$SSH_PORT" "$SSH_USER" > ~/.ssh/config
          ssh server 'php -v | head -1'

      - name: Deploy the SaaS
        working-directory: saas
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress
          ssh server "test -f $SAAS_DIR/.env" || { echo "::error::~/$SAAS_DIR/.env not found on the server."; exit 1; }
          # .env, storage and caches on the server are kept; files removed from the repo are removed there.
          rsync -az --delete -e ssh \
            --exclude=.env --exclude='/storage/' --exclude='/bootstrap/cache/*.php' --exclude=/tests/ \
            --exclude=/node_modules/ --exclude=/build/ --exclude=/database/database.sqlite --exclude=.phpunit.cache \
            ./ "server:$SAAS_DIR/"
          ssh server "cd $SAAS_DIR && php artisan package:discover && php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache"
          curl -fsS -o /dev/null -w 'Health check: %{http_code}\n' https://gama-api.avadawebsites.com/up

      - name: Deploy the plugin
        if: env.DEPLOY_PLUGIN == 'true'
        working-directory: plugin/gama-ai
        run: |
          # Only an existing Gama AI plugin folder is updated; nothing else in WordPress is touched.
          ssh server "test -f $PLUGIN_DIR/gama-ai.php" || { echo "::error::~/$PLUGIN_DIR/gama-ai.php not found. Install the plugin once in wp-admin first."; exit 1; }
          rsync -az --delete -e ssh gama-ai.php readme.txt src assets "server:$PLUGIN_DIR/"
